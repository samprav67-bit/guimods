        html { scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: #ffaa00 #0a0a12; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a0a12; }
        ::-webkit-scrollbar-thumb { background: #ffaa00; border-radius: 3px; }

        body {
            background: #050508;
            color: #f0f0f8;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
            position: relative;
            z-index: 3;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            background: rgba(10, 10, 18, 0.95);
            padding: 12px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            margin-bottom: 15px;
            gap: 8px;
        }

        .header-logo {
            font-size: 1.5em;
            font-weight: 900;
            color: #ffaa00;
        }
        .header-logo span { color: #66ccff; }

        .header-btn {
            background: rgba(30, 30, 44, 0.9);
            padding: 6px 10px;
            border-radius: 14px;
            color: #e0e0e8;
            font-size: 0.8em;
            border: 1px solid rgba(255, 170, 0, 0.3);
            cursor: pointer;
            margin: 2px;
            transition: all 0.2s;
        }
        .header-btn:hover { background: #ffaa00; color: #000; }

        .section-box {
            background: rgba(10, 10, 18, 0.9);
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 170, 0, 0.2);
        }
        .section-box h2 { font-size: 1.1em; color: #ffaa00; margin-bottom: 6px; }

        .filter-panel {
            background: rgba(10, 10, 18, 0.9);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: flex-end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
            min-width: 120px;
        }
        .filter-label {
            font-size: 0.65em;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .filter-select {
            padding: 7px 8px;
            border-radius: 8px;
            border: 1px solid rgba(255, 170, 0, 0.3);
            background: #1a1a2a;
            color: #fff;
            font-size: 0.8em;
            cursor: pointer;
            outline: none;
        }
        .filter-select:hover { border-color: #ffaa00; }
        .filter-select option { background: #1a1a2a; color: #fff; }

        .mod-loader-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.65em;
            font-weight: 700;
            margin-left: 4px;
        }
        .loader-forge { background: rgba(255, 100, 0, 0.3); color: #ff8844; border: 1px solid #ff8844; }
        .loader-fabric { background: rgba(255, 255, 100, 0.2); color: #ffff88; border: 1px solid #ffff88; }
        .loader-both { background: rgba(100, 255, 100, 0.2); color: #88ff88; border: 1px solid #88ff88; }
        .loader-quilt { background: rgba(180, 100, 255, 0.3); color: #cc88ff; border: 1px solid #cc88ff; }
        .loader-neoforge { background: rgba(255, 150, 50, 0.3); color: #ffaa66; border: 1px solid #ffaa66; }

        .category {
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 10px;
        }
        .cat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .cat-title { font-size: 1em; font-weight: 700; }
        .cat-count { font-size: 0.65em; background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 8px; }

        .mod-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 6px;
        }
        .mod-card {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            font-size: 0.75em;
            transition: all 0.2s;
        }
        .mod-card:hover {
            border-color: #ffaa00;
            transform: translateY(-2px);
        }
        .mod-name { font-weight: 700; color: #fff; }
        .mod-ver { color: #aaa; font-size: 0.85em; }
        .mod-meta { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 3px; }
        .price-free { color: #66ff66; }
        .price-paid { color: #ff6666; }

        .cat-cheats { background: #2a0a0a; border: 2px solid #ff4444; }
        .cat-cheats .cat-title { color: #ff5555; }
        .cat-visuals { background: #0a0a2a; border: 2px solid #6666ff; }

        .cat-shaders { background: #0a1a2a; border: 2px solid #44aaff; }

        .cat-resourcepacks { background: #1a2a0a; border: 2px solid #aaff44; }

        .cat-builds { background: #2a150a; border: 2px solid #ff9900; }

        .cat-tech { background: #0a1a1a; border: 2px solid #00cccc; }
        .cat-tech .cat-title { color: #22dddd; }
        .cat-magic { background: #1a0a2a; border: 2px solid #9900ff; }
        .cat-magic .cat-title { color: #aa22ff; }
        .cat-adventure { background: #0a1a0a; border: 2px solid #00cc66; }
        .cat-adventure .cat-title { color: #22dd77; }
        .cat-utility { background: #1a1a1a; border: 2px solid #bbbbdd; }

        .cat-other { background: #151515; border: 2px solid #999; }

        adventure: [['Twilight Forest 2','Team','1.21.4','Лес','free',9,'both'],['Aether 2','Team','1.21.4','Небеса','free',9,'both'],['Galacticraft 2','Team','1.21.11','Космос','free',8,'forge'],['Betweenlands 2','Team','1.21.4','Болото','free',9,'forge'],['Blue Skies 2','Team','1.21.4','Измерения','free',8,'both'],['Tropicraft 2','Team','1.21.4','Тропики','free',7,'forge'],['Erebus 2','Team','1.21.4','Насекомые','free',8,'forge'],['Atum 3','Team','1.21.11','Египет','free',8,'forge'],['Dimensional Doors','Team','1.21.4','Двери','free',8,'both'],['Advent of Ascension','Team','1.21.4','Приключения','free',8,'forge']],
        utility: [['JEI 2','mezz','1.21.4','Рецепты','free',10,'both'],['JourneyMap 2','Team','1.21.4','Карта','free',9,'both'],['Xaero Minimap 2','Xaero','1.21.11','Мини-карта','free',9,'both'],['WAILA 2','Team','1.21.4','Инфо','free',8,'both'],['Inv Tweaks 2','Team','1.21.4','Сортировка','free',8,'both'],['Mouse Tweaks 2','Team','1.21.4','Мышь','free',8,'both'],['Controlling 2','Team','1.21.4','Управление','free',7,'both'],['Better Advancements','Team','1.21.11','Достижения','free',8,'both'],['Clumps','Team','1.21.4','Опыт','free',8,'both'],['CraftTweaker','Team','1.21.4','Рецепты','free',8,'forge']],
        other: [['Biomes O Plenty 2','Team','1.21.4','Биомы','free',9,'both'],['Quark 2','Vazkii','1.21.4','Улучшения','free',8,'both'],['Tinkers Construct 2','Team','1.21.11','Инструменты','free',9,'forge'],['Waystones 2','Team','1.21.4','Телепорты','free',8,'both'],['Iron Chests 2','Team','1.21.4','Сундуки','free',8,'both'],['Pam HarvestCraft 2','Team','1.21.4','Еда','free',8,'both'],['Chisel 2','Team','1.21.4','Декорации','free',8,'both'],['Gravestone 2','Team','1.21.11','Могилы','free',8,'both'],['Sophisticated Backpacks','Team','1.21.4','Рюкзаки','free',8,'both'],['Storage Drawers','Team','1.21.4','Хранение','free',8,'both']]
    };

    for (const cat in realMods) {
        realMods[cat].forEach(m => {
            mods[cat].push({ name: m[0], author: m[1], ver: m[2], desc: m[3], price: m[4], rating: m[5], loader: m[6], downloads: Math.floor(Math.random()*1000000)+10000 });
        });
    }

    const adj = ['Atomic','Blazing','Cosmic','Crystal','Dark','Diamond','Electric','Emerald','Frozen','Golden','Hidden','Infernal','Jade','Lunar','Mystic','Neon','Obsidian','Omega','Phantom','Quantum','Radiant','Ruby','Sacred','Sapphire','Shadow','Silent','Solar','Stellar','Storm','Thunder'];
    const nouns = ['Blade','Craft','Crystal','Dragon','Forge','Guardian','Keeper','Legion','Monolith','Nexus','Omen','Phoenix','Realm','Relic','Sanctum','Sentinel','Serpent','Shadow','Spell','Spirit'];
    const usedNames = new Set();
    for (const cat in mods) mods[cat].forEach(m => usedNames.add(m.name));

    const allCats = Object.keys(mods);
    let counter = 0;
    while (Object.values(mods).reduce((s, arr) => s + arr.length, 0) < 2500) {
        const cat = allCats[counter % allCats.length];
        let name = '';
        do { name = `${adj[Math.floor(Math.random()*adj.length)]} ${nouns[Math.floor(Math.random()*nouns.length)]} ${counter}`; } while (usedNames.has(name));
        usedNames.add(name);
        const loader = loaders[Math.floor(Math.random()*loaders.length)];
        mods[cat].push({ name, author: 'Generated', ver: versions[Math.floor(Math.random()*versions.length)], desc: 'Улучшает игровой процесс', price: Math.random() > 0.6 ? 'paid' : 'free', rating: Math.floor(Math.random()*4)+7, loader, downloads: Math.floor(Math.random()*2000000)+5000 });
        counter++;
    }

    const versionSelect = document.getElementById('versionFilter');
    versions.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        versionSelect.appendChild(opt);
    });

    function createCard(m) {
        const card = document.createElement('div');
        card.className = 'mod-card';
        const loaderBadge = getLoaderBadge(m.loader || 'both');
        card.innerHTML = `
            <div class="mod-name">${m.name}</div>
            <div class="mod-ver">📌 ${m.ver} · ${m.author}</div>
            <div>${m.desc}</div>
            <div class="mod-meta">
                <span class="${m.price === 'free' ? 'price-free' : 'price-paid'}">${m.price === 'free' ? '🆓' : '💰'}</span>
                <span>⭐${m.rating}</span>
                <span>📥${(m.downloads/1000).toFixed(0)}k</span>
                ${loaderBadge}
            </div>
        `;
        card.addEventListener('click', () => window.open(`https://www.google.com/search?q=${encodeURIComponent(m.name + ' minecraft ' + m.ver + ' ' + (m.loader || ''))}`, '_blank'));
        return card;
    }

    function renderMods() {
        const container = document.getElementById('modsList');
        container.innerHTML = '';
        for (const cat in categories) {
            if (mods[cat].length === 0) continue;
            const catDiv = document.createElement('div');
            catDiv.className = `category ${categories[cat].color}`;
            catDiv.innerHTML = `<div class="cat-header"><span class="cat-title">${categories[cat].title}</span><span class="cat-count">${mods[cat].length}</span></div>`;
            const grid = document.createElement('div');
            grid.className = 'mod-grid';
            mods[cat].forEach(m => grid.appendChild(createCard(m)));
            catDiv.appendChild(grid);
            container.appendChild(catDiv);
        }
        document.getElementById('filterStats').textContent = `Всего: ${Object.values(mods).reduce((s, arr) => s + arr.length, 0)} модов`;
    }

    function applyFilters() {
        const version = document.getElementById('versionFilter').value;
        const loader = document.getElementById('loaderFilter').value;
        const category = document.getElementById('categoryFilter').value;
        const container = document.getElementById('modsList');
        container.innerHTML = '';
        let visibleCount = 0;
        for (const cat in categories) {
            if (category !== 'all' && cat !== category) continue;
            const filtered = mods[cat].filter(m => {
                if (version !== 'all' && m.ver !== version) return false;
                if (loader !== 'all' && m.loader !== loader) return false;
                return true;
            });
            if (filtered.length === 0) continue;
            visibleCount += filtered.length;
            const catDiv = document.createElement('div');
            catDiv.className = `category ${categories[cat].color}`;
            catDiv.innerHTML = `<div class="cat-header"><span class="cat-title">${categories[cat].title}</span><span class="cat-count">${filtered.length}</span></div>`;
            const grid = document.createElement('div');
            grid.className = 'mod-grid';
            filtered.forEach(m => grid.appendChild(createCard(m)));
            catDiv.appendChild(grid);
            container.appendChild(catDiv);
        }
        document.getElementById('filterStats').textContent = `Показано: ${visibleCount} | Версия: ${version === 'all' ? 'Все' : version} | Загрузчик: ${loader === 'all' ? 'Все' : loader}`;
    }

    function resetFilters() {
        document.getElementById('versionFilter').value = 'all';
        document.getElementById('loaderFilter').value = 'all';
        document.getElementById('categoryFilter').value = 'all';
        document.getElementById('searchInput').value = '';
        renderMods();
    }

    document.getElementById('searchInput').addEventListener('input', function() {
        const q = this.value.toLowerCase().trim();
        const container = document.getElementById('modsList');
        container.innerHTML = '';
        let visibleCount = 0;
        for (const cat in categories) {
            const filtered = mods[cat].filter(m => m.name.toLowerCase().includes(q));
            if (filtered.length === 0) continue;
            visibleCount += filtered.length;
            const catDiv = document.createElement('div');
            catDiv.className = `category ${categories[cat].color}`;
            catDiv.innerHTML = `<div class="cat-header"><span class="cat-title">${categories[cat].title}</span><span class="cat-count">${filtered.length}</span></div>`;
            const grid = document.createElement('div');
            grid.className = 'mod-grid';
            filtered.forEach(m => grid.appendChild(createCard(m)));
            catDiv.appendChild(grid);
            container.appendChild(catDiv);
        }
        document.getElementById('filterStats').textContent = `Найдено: ${visibleCount}`;
    });

    renderMods();
</script>
</body>
