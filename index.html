<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nimbus — мессенджер для общения</title>
<style>
  :root{
    --bg:#0e1621;
    --bg-sidebar:#17212b;
    --bg-chat:#0e1621;
    --bg-hover:#202b36;
    --bg-active:#2b5278;
    --bubble-in:#182533;
    --bubble-out:#2b5278;
    --accent:#5288c1;
    --accent-2:#7ab3ef;
    --text:#ffffff;
    --text-dim:#7f91a4;
    --border:#0b0f14;
    --input:#242f3d;
    --shadow:rgba(0,0,0,.35);
  }
  body.light{
    --bg:#ffffff;
    --bg-sidebar:#f4f6f9;
    --bg-chat:#e7ebf0;
    --bg-hover:#e4e9ef;
    --bg-active:#4f92d6;
    --bubble-in:#ffffff;
    --bubble-out:#d6e8fb;
    --accent:#4f92d6;
    --accent-2:#2b6cb0;
    --text:#1c2833;
    --text-dim:#8a97a5;
    --border:#dde3ea;
    --input:#eef2f6;
    --shadow:rgba(0,0,0,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--text);overflow:hidden;transition:background .3s,color .3s;}

  #app{display:flex;height:100vh;width:100vw;}

  #sidebar{
    width:340px;min-width:300px;height:100%;
    background:var(--bg-sidebar);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
    transition:transform .3s;
  }
  #sidebar .top{
    padding:12px 14px;display:flex;gap:10px;align-items:center;
  }
  .logo{
    font-weight:700;font-size:18px;white-space:nowrap;
    background:linear-gradient(90deg,#5288c1,#7ab3ef);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  #search{
    flex:1;background:var(--input);border:none;outline:none;
    padding:9px 14px;border-radius:20px;color:var(--text);font-size:14px;
  }
  #search::placeholder{color:var(--text-dim);}
  #themeBtn, #profileBtn{
    width:38px;height:38px;border:none;border-radius:50%;cursor:pointer;
    background:var(--input);color:var(--text);font-size:17px;flex-shrink:0;
    transition:transform .2s;
  }
  #themeBtn:hover{transform:rotate(20deg);}
  #profileBtn:hover{transform:scale(1.1);}

  #chatList{flex:1;overflow-y:auto;}
  #chatList::-webkit-scrollbar{width:5px;}
  #chatList::-webkit-scrollbar-thumb{background:var(--bg-hover);border-radius:3px;}

  .chat-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 14px;cursor:pointer;transition:background .15s;
  }
  .chat-item:hover{background:var(--bg-hover);}
  .chat-item.active{background:var(--bg-active);}
  .chat-item.active .last,.chat-item.active .time{color:rgba(255,255,255,.75);}
  .chat-item.active .name{color:#fff;}

  .avatar{
    width:50px;height:50px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:17px;color:#fff;position:relative;
    background:linear-gradient(135deg,#5288c1,#7ab3ef);
    overflow:hidden;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .chat-info{flex:1;min-width:0;}
  .chat-row1{display:flex;justify-content:space-between;align-items:baseline;}
  .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .time{font-size:12px;color:var(--text-dim);flex-shrink:0;margin-left:8px;}
  .chat-row2{display:flex;justify-content:space-between;align-items:center;margin-top:3px;}
  .last{font-size:13.5px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}

  #chatArea{flex:1;display:flex;flex-direction:column;height:100%;position:relative;}

  #chatHeader{
    display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:var(--bg-sidebar);border-bottom:1px solid var(--border);
  }
  #backBtn{
    display:none;width:38px;height:38px;border:none;border-radius:50%;
    background:transparent;color:var(--text);font-size:20px;cursor:pointer;
  }
  #chatHeader .avatar{width:42px;height:42px;font-size:15px;}
  .h-name{font-weight:600;font-size:15.5px;}
  .h-status{font-size:13px;color:var(--text-dim);}
  .h-status.online{color:#43cc5e;}
  #headerActions{margin-left:auto;display:flex;gap:6px;}
  #headerActions button{
    width:38px;height:38px;border:none;border-radius:50%;cursor:pointer;
    background:transparent;color:var(--text-dim);font-size:17px;transition:background .15s;
  }
  #headerActions button:hover{background:var(--bg-hover);}

  #messages{
    flex:1;overflow-y:auto;padding:20px 8%;
    display:flex;flex-direction:column;gap:4px;
  }
  #messages::-webkit-scrollbar{width:6px;}
  #messages::-webkit-scrollbar-thumb{background:var(--bg-hover);border-radius:3px;}

  .date-chip{
    align-self:center;background:var(--bg-sidebar);color:var(--text-dim);
    font-size:12.5px;padding:5px 12px;border-radius:14px;margin:10px 0;
    box-shadow:0 1px 2px var(--shadow);
  }
  .msg{
    max-width:65%;padding:8px 12px;border-radius:14px;
    font-size:15px;line-height:1.4;position:relative;
    box-shadow:0 1px 2px var(--shadow);
    animation:pop .18s ease-out;
    word-wrap:break-word;
  }
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97);}to{opacity:1;transform:none;}}
  .msg.in{align-self:flex-start;background:var(--bubble-in);border-bottom-left-radius:4px;}
  .msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:4px;color:#fff;}
  body.light .msg.out{color:var(--text);}
  .msg .m-time{
    font-size:11px;opacity:.6;float:right;margin:8px 0 0 10px;
    display:inline-flex;align-items:center;gap:3px;
  }

  #inputBar{
    display:flex;align-items:flex-end;gap:8px;padding:10px 14px 14px;
  }
  .iBtn{
    width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;
    background:transparent;color:var(--text-dim);font-size:20px;flex-shrink:0;
    transition:background .15s,color .15s;
  }
  .iBtn:hover{background:var(--bg-hover);color:var(--text);}
  #msgInput{
    flex:1;background:var(--input);border:none;outline:none;resize:none;
    color:var(--text);font-size:15px;padding:12px 16px;border-radius:22px;
    max-height:120px;line-height:1.35;font-family:inherit;
  }
  #msgInput::placeholder{color:var(--text-dim);}
  #sendBtn{
    width:44px;height:44px;border:none;border-radius:50%;cursor:pointer;flex-shrink:0;
    background:var(--accent);color:#fff;font-size:18px;
    display:flex;align-items:center;justify-content:center;
    transition:transform .15s,background .15s;
  }
  #sendBtn:hover{transform:scale(1.08);background:var(--accent-2);}

  #emptyState{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;
    background:var(--bg-chat);z-index:5;
  }
  #emptyState .big{
    width:110px;height:110px;border-radius:50%;
    background:linear-gradient(135deg,#5288c1,#7ab3ef);
    display:flex;align-items:center;justify-content:center;font-size:50px;
    box-shadow:0 10px 30px var(--shadow);
  }
  #emptyState p{color:var(--text-dim);font-size:15px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:none;align-items:center;justify-content:center;z-index:100;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--bg-sidebar);border-radius:16px;
    padding:24px;width:90%;max-width:400px;
    box-shadow:0 10px 40px var(--shadow);
  }
  .modal h2{margin-bottom:20px;font-size:20px;text-align:center;}
  .modal input{
    width:100%;padding:12px 16px;margin-bottom:12px;
    background:var(--input);border:none;outline:none;
    border-radius:10px;color:var(--text);font-size:15px;
  }
  .modal button{
    width:100%;padding:12px;margin-top:8px;
    background:var(--accent);color:#fff;border:none;
    border-radius:10px;cursor:pointer;font-size:15px;font-weight:600;
    transition:background .15s;
  }
  .modal button:hover{background:var(--accent-2);}
  .modal button.secondary{
    background:transparent;color:var(--text-dim);
    border:1px solid var(--border);
  }
  .modal button.secondary:hover{background:var(--bg-hover);}

  #profileSection{
    margin-top:16px;padding-top:16px;border-top:1px solid var(--border);
  }
  #profileSection .avatar{
    width:80px;height:80px;font-size:28px;margin:0 auto 12px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  #profileSection .avatar:hover{opacity:.8;}

  /* Call Modal */
  #callModal{
    position:fixed;inset:0;background:rgba(0,0,0,.95);
    display:none;align-items:center;justify-content:center;z-index:200;
    flex-direction:column;gap:20px;
  }
  #callModal.open{display:flex;}
  #callModal .call-info{color:white;text-align:center;z-index:2;}
  #callModal .call-name{font-size:24px;font-weight:600;margin-bottom:10px;}
  #callModal .call-status{font-size:16px;color:#ccc;}
  #callModal .call-avatar{
    width:100px;height:100px;border-radius:50%;
    background:linear-gradient(135deg,#5288c1,#7ab3ef);
    display:flex;align-items:center;justify-content:center;
    font-size:40px;color:white;margin-bottom:20px;overflow:hidden;z-index:2;
  }
  #callModal .call-avatar img{width:100%;height:100%;object-fit:cover;}
  #callModal .call-actions{display:flex;gap:20px;z-index:2;}
  #callModal .call-btn{
    width:60px;height:60px;border-radius:50%;border:none;cursor:pointer;
    font-size:24px;display:flex;align-items:center;justify-content:center;
    transition:transform .2s;
  }
  #callModal .call-btn:hover{transform:scale(1.1);}
  #callModal .call-btn.end{background:#e74c3c;color:white;}
  #callModal .call-btn.mute{background:#34495e;color:white;}
  #callModal .call-btn.mute.active{background:#e67e22;}
  #callModal .call-btn.video{background:#3498db;color:white;}

  #remoteVideo{
    position:absolute;top:0;left:0;width:100%;height:100%;
    object-fit:cover;display:none;
  }
  #localVideo{
    position:fixed;bottom:20px;right:20px;
    width:150px;height:112px;border-radius:10px;
    object-fit:cover;z-index:201;display:none;
    border:2px solid white;
  }

  #incomingCallModal{
    position:fixed;top:20px;right:20px;
    background:var(--bg-sidebar);border-radius:16px;
    padding:20px;box-shadow:0 10px 40px var(--shadow);
    z-index:300;display:none;animation:slideIn .3s ease-out;
  }
  #incomingCallModal.open{display:block;}
  @keyframes slideIn{
    from{transform:translateX(100%);opacity:0;}
    to{transform:translateX(0);opacity:1;}
  }
  #incomingCallModal .caller-info{
    display:flex;align-items:center;gap:15px;margin-bottom:20px;
  }
  #incomingCallModal .call-actions{
    display:flex;gap:10px;justify-content:center;
  }
  #incomingCallModal .btn{
    padding:10px 20px;border-radius:25px;border:none;cursor:pointer;
    font-size:14px;font-weight:600;transition:transform .2s;
  }
  #incomingCallModal .btn:hover{transform:scale(1.05);}
  #incomingCallModal .btn.accept{background:#27ae60;color:white;}
  #incomingCallModal .btn.decline{background:#e74c3c;color:white;}

  @media(max-width:760px){
    #sidebar{width:100%;min-width:0;position:absolute;z-index:10;height:100%;}
    body.in-chat #sidebar{transform:translateX(-100%);}
    #backBtn{display:flex;align-items:center;justify-content:center;}
    #messages{padding:16px 4%;}
    .msg{max-width:82%;}
    #localVideo{width:100px;height:75px;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="top">
      <div class="logo">Nimbus</div>
      <input id="search" type="text" placeholder="Введите номер друга" autocomplete="off">
      <button id="themeBtn" title="Сменить тему">🌙</button>
      <button id="profileBtn" title="Мой профиль">⚙️</button>
    </div>
    <div id="chatList"></div>
  </aside>

  <main id="chatArea">
    <div id="emptyState">
      <div class="big">💬</div>
      <p>Введите номер друга в поиске, чтобы начать чат</p>
    </div>

    <div id="chatHeader" style="display:none">
      <button id="backBtn">←</button>
      <div class="avatar" id="hAvatar"></div>
      <div>
        <div class="h-name" id="hName"></div>
        <div class="h-status" id="hStatus">в сети</div>
      </div>
      <div id="headerActions">
        <button title="Голосовой звонок" onclick="startVoiceCall()">📞</button>
        <button title="Видеозвонок" onclick="startVideoCall()">🎥</button>
      </div>
    </div>

    <div id="messages"></div>

    <div id="inputBar" style="display:none">
      <button class="iBtn" id="attachBtn" title="Прикрепить">📎</button>
      <textarea id="msgInput" rows="1" placeholder="Сообщение"></textarea>
      <button id="sendBtn" title="Отправить">➤</button>
    </div>
  </main>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <h2>Вход в Nimbus</h2>
    <input type="tel" id="phoneInput" placeholder="Ваш номер (например: 79001234567)">
    <input type="text" id="nameInput" placeholder="Ваше имя">
    <button onclick="login()">Войти</button>
    <p style="text-align:center;margin-top:15px;color:var(--text-dim);font-size:12px;">
      Придумайте любой номер и сообщите его другу
    </p>
  </div>
</div>

<!-- Profile Modal -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <h2>Мой профиль</h2>
    <div id="profileSection">
      <div class="avatar" id="profileAvatar" onclick="changeAvatar()">📷</div>
      <input type="text" id="profileName" placeholder="Имя">
      <input type="tel" id="profilePhone" placeholder="Номер телефона" disabled style="opacity:.6;">
      <button onclick="saveProfile()">Сохранить</button>
      <button class="secondary" onclick="closeProfile()">Закрыть</button>
      <button class="secondary" onclick="logout()" style="color:#e17076;">Выйти</button>
    </div>
  </div>
</div>

<!-- Search Result Modal -->
<div class="modal-overlay" id="searchModal">
  <div class="modal">
    <h2>Найден пользователь</h2>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
      <div class="avatar" id="foundAvatar" style="width:60px;height:60px;"></div>
      <div>
        <div id="foundName" style="font-weight:600;font-size:16px;"></div>
        <div id="foundPhone" style="color:var(--text-dim);font-size:14px;"></div>
      </div>
    </div>
    <button onclick="startChatWithFound()">Начать чат</button>
    <button class="secondary" onclick="closeSearchModal()">Отмена</button>
  </div>
</div>

<!-- Call Modal -->
<div id="callModal">
  <video id="remoteVideo" autoplay playsinline></video>
  <div class="call-avatar" id="callAvatar"></div>
  <div class="call-info">
    <div class="call-name" id="callName"></div>
    <div class="call-status" id="callStatus">Вызов...</div>
  </div>
  <div class="call-actions">
    <button class="call-btn mute" id="muteBtn" onclick="toggleMute()">🎤</button>
    <button class="call-btn video" id="videoBtn" onclick="toggleVideo()">📹</button>
    <button class="call-btn end" onclick="endCall()">📞</button>
  </div>
</div>

<video id="localVideo" autoplay muted playsinline></video>

<!-- Incoming Call Modal -->
<div id="incomingCallModal">
  <div class="caller-info">
    <div class="call-avatar" id="incomingAvatar" style="width:60px;height:60px;font-size:24px;"></div>
    <div>
      <div style="font-weight:600;" id="incomingName"></div>
      <div style="color:var(--text-dim);font-size:14px;" id="incomingType">Входящий звонок...</div>
    </div>
  </div>
  <div class="call-actions">
    <button class="btn accept" onclick="acceptCall()">Принять</button>
    <button class="btn decline" onclick="declineCall()">Отклонить</button>
  </div>
</div>

<!-- PeerJS для звонков -->
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>

<script>
// ================= ДАННЫЕ =================
let currentUser = null;
let activeChat = null;
let foundUser = null;
let peer = null;
let localStream = null;
let currentCall = null;
let isMuted = false;
let isVideoEnabled = false;
let callType = 'voice';

// Хранилище пользователей (в реальном проекте - сервер)
let users = JSON.parse(localStorage.getItem('nimbus_users') || '[]');
let chats = JSON.parse(localStorage.getItem('nimbus_chats') || '[]');
let messages = JSON.parse(localStorage.getItem('nimbus_messages') || '[]');

const $ = s => document.querySelector(s);
const chatListEl = $("#chatList"), messagesEl = $("#messages");
const inputBar = $("#inputBar"), chatHeader = $("#chatHeader"), emptyState = $("#emptyState");
const msgInput = $("#msgInput");

function initials(name){
  if (!name) return "?";
  return name.replace(/[^\p{L} ]/gu,"").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
}

function avatarStyle(avatar){
  if (avatar) return `background-image:url(${avatar});background-size:cover;`;
  return "background:linear-gradient(135deg,#5288c1,#7ab3ef);";
}

function nowTime(){
  const d = new Date();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}

function saveData() {
  localStorage.setItem('nimbus_users', JSON.stringify(users));
  localStorage.setItem('nimbus_chats', JSON.stringify(chats));
  localStorage.setItem('nimbus_messages', JSON.stringify(messages));
}

// ================= АВТОРИЗАЦИЯ =================
function login() {
  const phone = $("#phoneInput").value.trim().replace(/\D/g, '');
  const name = $("#nameInput").value.trim();
  
  if (!phone || !name) {
    alert("Введите номер телефона и имя");
    return;
  }
  
  let normalizedPhone = phone;
  if (normalizedPhone.startsWith('8')) normalizedPhone = '7' + normalizedPhone.slice(1);
  if (!normalizedPhone.startsWith('7')) normalizedPhone = '7' + normalizedPhone;
  
  let user = users.find(u => u.phone === normalizedPhone);
  if (user) {
    user.name = name;
  } else {
    user = { phone: normalizedPhone, name: name, avatar: null };
    users.push(user);
  }
  
  currentUser = user;
  localStorage.setItem('nimbus_current_user', JSON.stringify(currentUser));
  saveData();
  
  $("#authModal").classList.remove("open");
  initPeer();
  initializeApp();
}

function logout() {
  currentUser = null;
  localStorage.removeItem('nimbus_current_user');
  if (peer) peer.destroy();
  closeProfile();
  resetChatView();
  chatListEl.innerHTML = "";
  $("#authModal").classList.add("open");
}

// ================= PEERJS ДЛЯ ЗВОНКОВ =================
function initPeer() {
  if (!currentUser) return;
  
  peer = new Peer('nimbus-' + currentUser.phone, {
    debug: 2
  });
  
  peer.on('open', (id) => {
    console.log('My peer ID is: ' + id);
  });
  
  peer.on('call', (call) => {
    currentCall = call;
    
    // Показываем входящий звонок
    const callerPhone = call.metadata.from;
    const caller = users.find(u => u.phone === callerPhone);
    
    if (caller) {
      showIncomingCall(caller, call.metadata.type);
    }
    
    call.on('stream', (remoteStream) => {
      const remoteVideo = $("#remoteVideo");
      remoteVideo.srcObject = remoteStream;
      remoteVideo.style.display = 'block';
      $("#callStatus").textContent = 'В сети';
    });
    
    call.on('close', () => {
      endCall();
    });
  });
  
  peer.on('error', (err) => {
    console.error('PeerJS error:', err);
    if (err.type === 'peer-unavailable') {
      alert('Пользователь не в сети');
      endCall();
    }
  });
}

async function startVoiceCall() {
  if (!activeChat || !currentUser || !peer) return;
  callType = 'voice';
  await initiateCall();
}

async function startVideoCall() {
  if (!activeChat || !currentUser || !peer) return;
  callType = 'video';
  await initiateCall();
}

async function initiateCall() {
  try {
    const constraints = {
      audio: true,
      video: callType === 'video'
    };
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    
    // Показываем локальное видео
    if (callType === 'video') {
      $("#localVideo").srcObject = localStream;
      $("#localVideo").style.display = 'block';
    }
    
    // Звоним пользователю
    const call = peer.call('nimbus-' + activeChat.phone, localStream, {
      metadata: { from: currentUser.phone, type: callType }
    });
    
    currentCall = call;
    showCallModal(activeChat, 'Вызов...', callType);
    
    call.on('stream', (remoteStream) => {
      const remoteVideo = $("#remoteVideo");
      remoteVideo.srcObject = remoteStream;
      remoteVideo.style.display = 'block';
      $("#callStatus").textContent = 'В сети';
    });
    
    call.on('close', () => {
      endCall();
    });
    
    call.on('error', (err) => {
      console.error('Call error:', err);
      alert('Ошибка звонка');
      endCall();
    });
    
  } catch (error) {
    console.error('Media error:', error);
    alert('Не удалось получить доступ к камере/микрофону');
  }
}

function showIncomingCall(caller, type) {
  callType = type || 'voice';
  
  const avatarEl = $("#incomingAvatar");
  if (caller.avatar) {
    avatarEl.innerHTML = `<img src="${caller.avatar}" alt="avatar">`;
  } else {
    avatarEl.textContent = initials(caller.name);
  }
  $("#incomingName").textContent = caller.name;
  $("#incomingType").textContent = callType === 'video' ? 'Видеозвонок...' : 'Голосовой звонок...';
  $("#incomingCallModal").classList.add("open");
  
  playRingtone();
}

function playRingtone() {
  try {
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = 800;
    oscillator.type = 'sine';
    gainNode.gain.value = 0.1;
    
    oscillator.start();
    setTimeout(() => {
      oscillator.stop();
      audioContext.close();
    }, 1000);
  } catch (error) {}
}

async function acceptCall() {
  if (!currentCall) return;
  
  try {
    const constraints = {
      audio: true,
      video: callType === 'video'
    };
    localStream = await navigator.mediaDevices.getUserMedia(constraints);
    
    currentCall.answer(localStream);
    $("#incomingCallModal").classList.remove("open");
    
    if (callType === 'video') {
      $("#localVideo").srcObject = localStream;
      $("#localVideo").style.display = 'block';
    }
    
    const callerPhone = currentCall.metadata.from;
    const caller = users.find(u => u.phone === callerPhone);
    if (caller) {
      showCallModal(caller, 'Соединение...', callType);
    }
    
  } catch (error) {
    console.error('Accept call error:', error);
    alert('Не удалось получить доступ к камере/микрофону');
  }
}

function declineCall() {
  if (currentCall) {
    currentCall.close();
  }
  $("#incomingCallModal").classList.remove("open");
  currentCall = null;
}

function showCallModal(user, status, type = 'voice') {
  const avatarEl = $("#callAvatar");
  if (user.avatar) {
    avatarEl.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
  } else {
    avatarEl.textContent = initials(user.name);
  }
  $("#callName").textContent = user.name;
  $("#callStatus").textContent = status;
  
  const remoteVideo = $("#remoteVideo");
  const localVideo = $("#localVideo");
  const videoBtn = $("#videoBtn");
  
  if (type === 'video') {
    remoteVideo.style.display = 'block';
    localVideo.style.display = 'block';
    videoBtn.style.display = 'flex';
  } else {
    remoteVideo.style.display = 'none';
    localVideo.style.display = 'none';
    videoBtn.style.display = 'none';
  }
  
  $("#callModal").classList.add("open");
}

function endCall() {
  if (currentCall) {
    currentCall.close();
    currentCall = null;
  }
  
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
    localStream = null;
  }
  
  $("#callModal").classList.remove("open");
  $("#remoteVideo").srcObject = null;
  $("#localVideo").srcObject = null;
  isMuted = false;
  isVideoEnabled = false;
}

function toggleMute() {
  if (!localStream) return;
  
  isMuted = !isMuted;
  localStream.getAudioTracks().forEach(track => {
    track.enabled = !isMuted;
  });
  
  $("#muteBtn").classList.toggle("active", isMuted);
  $("#muteBtn").textContent = isMuted ? '🔇' : '🎤';
}

function toggleVideo() {
  if (!localStream || callType !== 'video') return;
  
  isVideoEnabled = !isVideoEnabled;
  localStream.getVideoTracks().forEach(track => {
    track.enabled = isVideoEnabled;
  });
  
  $("#videoBtn").classList.toggle("active", isVideoEnabled);
  $("#videoBtn").textContent = isVideoEnabled ? '📹' : '📷';
}

// ================= ЧАТ =================
function searchUser(phone) {
  const cleanPhone = phone.replace(/\D/g, '');
  let normalized = cleanPhone.startsWith('8') ? '7' + cleanPhone.slice(1) : cleanPhone;
  if (!normalized.startsWith('7')) normalized = '7' + normalized;
  
  return users.find(u => u.phone === normalized);
}

function openSearchResult(user) {
  if (!user || user.phone === currentUser.phone) {
    alert(user ? "Это ваш номер" : "Пользователь не найден. Попросите друга зарегистрироваться с этим номером");
    return;
  }
  
  foundUser = user;
  const avatarEl = $("#foundAvatar");
  if (user.avatar) {
    avatarEl.style.cssText = avatarStyle(user.avatar);
    avatarEl.innerHTML = `<img src="${user.avatar}" alt="avatar">`;
  } else {
    avatarEl.style.cssText = avatarStyle(null);
    avatarEl.textContent = initials(user.name);
  }
  $("#foundName").textContent = user.name;
  $("#foundPhone").textContent = '+' + user.phone;
  $("#searchModal").classList.add("open");
}

function closeSearchModal() {
  $("#searchModal").classList.remove("open");
  foundUser = null;
}

function startChatWithFound() {
  if (!foundUser || !currentUser) return;
  
  const participants = [currentUser.phone, foundUser.phone].sort();
  const chatId = participants.join('_');
  
  let chat = chats.find(c => c.id === chatId);
  if (!chat) {
    chat = { id: chatId, participants: participants, createdAt: Date.now() };
    chats.push(chat);
    saveData();
  }
  
  closeSearchModal();
  openChat(foundUser, chatId);
}

function loadChats() {
  if (!currentUser) return;
  const userChats = chats.filter(c => c.participants.includes(currentUser.phone));
  renderChatList(userChats);
}

function renderChatList(userChats) {
  chatListEl.innerHTML = "";
  
  userChats.forEach(chat => {
    const otherPhone = chat.participants.find(p => p !== currentUser.phone);
    const participant = users.find(u => u.phone === otherPhone);
    if (!participant) return;
    
    const chatMessages = messages.filter(m => m.chatId === chat.id);
    const lastMessage = chatMessages.length > 0 ? chatMessages[chatMessages.length - 1] : null;
    
    const el = document.createElement("div");
    el.className = "chat-item" + (activeChat && activeChat.phone === participant.phone ? " active":"");
    
    const participantAvatar = participant.avatar ? 
      `<img src="${participant.avatar}" alt="avatar">` : 
      initials(participant.name);
    
    const lastText = lastMessage ? 
      (lastMessage.from === currentUser.phone ? "Вы: " : "") + lastMessage.text : 
      "Начните чат";
    
    el.innerHTML = `
      <div class="avatar" style="${participant.avatar ? avatarStyle(participant.avatar) : avatarStyle(null)}">
        ${participantAvatar}
      </div>
      <div class="chat-info">
        <div class="chat-row1">
          <span class="name">${participant.name}</span>
        </div>
        <div class="chat-row2">
          <span class="last">${lastText}</span>
        </div>
      </div>`;
    
    el.onclick = () => openChat(participant, chat.id);
    chatListEl.appendChild(el);
  });
}

function openChat(participant, chatId) {
  activeChat = participant;
  activeChat.chatId = chatId;
  
  document.body.classList.add("in-chat");
  emptyState.style.display = "none";
  chatHeader.style.display = "flex";
  inputBar.style.display = "flex";

  const av = $("#hAvatar");
  if (participant.avatar) {
    av.style.cssText = avatarStyle(participant.avatar);
    av.innerHTML = `<img src="${participant.avatar}" alt="avatar">`;
  } else {
    av.style.cssText = avatarStyle(null);
    av.textContent = initials(participant.name);
  }
  
  $("#hName").textContent = participant.name;
  renderMessages(chatId);
  msgInput.focus();
}

function renderMessages(chatId) {
  messagesEl.innerHTML = "";
  const chatMessages = messages.filter(m => m.chatId === chatId);
  
  if (chatMessages.length === 0) {
    const empty = document.createElement("div");
    empty.style.cssText = "text-align:center;color:var(--text-dim);margin-top:40px;font-size:14px;";
    empty.textContent = "Нет сообщений. Начните общение!";
    messagesEl.appendChild(empty);
    return;
  }
  
  chatMessages.forEach(m => {
    const isOut = m.from === currentUser.phone;
    const el = document.createElement("div");
    el.className = "msg " + (isOut ? "out" : "in");
    el.innerHTML = `${escapeHtml(m.text)}<span class="m-time">${m.time}${isOut ? " ✓✓" : ""}</span>`;
    messagesEl.appendChild(el);
  });
  
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function resetChatView() {
  document.body.classList.remove("in-chat");
  emptyState.style.display = "flex";
  chatHeader.style.display = "none";
  inputBar.style.display = "none";
  messagesEl.innerHTML = "";
  activeChat = null;
}

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text || !activeChat || !currentUser) return;
  
  const message = {
    chatId: activeChat.chatId,
    from: currentUser.phone,
    text: text,
    timestamp: Date.now(),
    time: nowTime()
  };
  
  messages.push(message);
  saveData();
  
  msgInput.value = "";
  msgInput.style.height = "auto";
  renderMessages(activeChat.chatId);
  loadChats();
}

msgInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { 
    e.preventDefault(); 
    sendMessage(); 
  }
});

$("#sendBtn").onclick = sendMessage;
$("#backBtn").onclick = () => { resetChatView(); loadChats(); };
$("#profileBtn").onclick = showProfile;

$("#search").addEventListener("input", e => {
  const query = e.target.value.trim();
  if (query.length >= 10) {
    const user = searchUser(query);
    if (user) {
      openSearchResult(user);
      e.target.value = "";
    }
  }
});

$("#search").addEventListener("keydown", e => {
  if (e.key === "Enter") {
    const query = e.target.value.trim();
    const user = searchUser(query);
    if (user) {
      openSearchResult(user);
      e.target.value = "";
    }
  }
});

function showProfile() {
  if (!currentUser) return;
  $("#profileName").value = currentUser.name;
  $("#profilePhone").value = '+' + currentUser.phone;
  const avatarEl = $("#profileAvatar");
  if (currentUser.avatar) {
    avatarEl.style.cssText = avatarStyle(currentUser.avatar);
    avatarEl.innerHTML = `<img src="${currentUser.avatar}" alt="avatar">`;
  } else {
    avatarEl.style.cssText = avatarStyle(null);
    avatarEl.textContent = initials(currentUser.name);
  }
  $("#profileModal").classList.add("open");
}

function closeProfile() { $("#profileModal").classList.remove("open"); }

function saveProfile() {
  const name = $("#profileName").value.trim();
  if (!name || !currentUser) return;
  currentUser.name = name;
  const userIndex = users.findIndex(u => u.phone === currentUser.phone);
  if (userIndex !== -1) users[userIndex] = currentUser;
  localStorage.setItem('nimbus_current_user', JSON.stringify(currentUser));
  saveData();
  closeProfile();
  loadChats();
}

function changeAvatar() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (file && currentUser) {
      const reader = new FileReader();
      reader.onload = (event) => {
        currentUser.avatar = event.target.result;
        const userIndex = users.findIndex(u => u.phone === currentUser.phone);
        if (userIndex !== -1) users[userIndex] = currentUser;
        localStorage.setItem('nimbus_current_user', JSON.stringify(currentUser));
        saveData();
        showProfile();
        loadChats();
      };
      reader.readAsDataURL(file);
    }
  };
  input.click();
}

const themeBtn = $("#themeBtn");
themeBtn.onclick = () => {
  document.body.classList.toggle("light");
  const light = document.body.classList.contains("light");
  themeBtn.textContent = light ? "☀️" : "🌙";
  try { localStorage.setItem("nimbus-theme", light ? "light" : "dark"); } catch(_) {}
};

try {
  if (localStorage.getItem("nimbus-theme") === "light") {
    document.body.classList.add("light");
    themeBtn.textContent = "☀️";
  }
} catch(_) {}

function initializeApp() {
  if (currentUser) {
    $("#authModal").classList.remove("open");
    loadChats();
  } else {
    $("#authModal").classList.add("open");
  }
}

const savedUser = localStorage.getItem('nimbus_current_user');
if (savedUser) {
  currentUser = JSON.parse(savedUser);
  initPeer();
  initializeApp();
} else {
  $("#authModal").classList.add("open");
}
